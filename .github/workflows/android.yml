name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Fetch pinned native runtime
        run: python3 scripts/prepare_native.py
      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease lintRelease
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.*
      - name: Publish direct APK release asset
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="MiniCPM-Feasibility-Android-build-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "build-${GITHUB_RUN_NUMBER}" "$apk" --target "$GITHUB_SHA" --title "Android feasibility build ${GITHUB_RUN_NUMBER}" --notes 'Experimental CPU voice benchmark. Download the APK asset directly. See README for model setup and test limitations.'
