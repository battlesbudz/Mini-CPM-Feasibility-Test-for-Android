name: Liquid Voice APK
on:
  push:
    branches: [main]
    paths: ["liquid/**", "scripts/prepare_liquid.py", "settings.gradle.kts", ".github/workflows/liquid.yml"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Install Vulkan shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc
          git clone --depth 1 --branch vulkan-sdk-1.4.328.1 https://github.com/KhronosGroup/Vulkan-Headers.git vendor/Vulkan-Headers
      - name: Fetch pinned native runtime
        run: python3 scripts/prepare_liquid.py
      - name: Test and build
        run: ./gradlew --no-daemon :liquid:testDebugUnitTest :liquid:assembleRelease :liquid:lintRelease
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-validation-results
          path: |
            liquid/build/reports/tests/
            liquid/build/reports/lint-results-release.*
      - name: Publish direct APK release asset
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="Liquid-Voice-Feasibility-build-${GITHUB_RUN_NUMBER}.apk"
          cp liquid/build/outputs/apk/release/liquid-release.apk "$apk"
          gh release create "liquid-build-${GITHUB_RUN_NUMBER}" "$apk" --target "$GITHUB_SHA" --title "Liquid voice feasibility build ${GITHUB_RUN_NUMBER}" --notes 'Recorded-question Liquid Q4 CPU smoke test. Install alongside MiniCPM. See docs/liquid-benchmark.md for instructions and limitations.'
